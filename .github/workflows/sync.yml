name: Sincronizador Automatico de Futbol

on:
  schedule:
    # Se ejecuta automaticamente cada 4 horas
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Despertar Render y Sincronizar Alarmas
        run: |
          curl -s "https://futbol-analytics-8401.onrender.com/api/alarmas_hoy?forzar=true" > /dev/null
          echo "Sincronizacion ejecutada con exito en Render y Supabase."