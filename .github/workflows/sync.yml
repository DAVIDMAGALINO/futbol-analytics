name: Sincronizacion Automatica de Futbol

on:
  schedule:
    # 11:00 UTC = 06:00 AM hora de Ecuador
    - cron: '0 11 * * *'
    # 13:30 UTC = 08:30 AM hora de Ecuador
    - cron: '30 13 * * *'
  workflow_dispatch:

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar API y sincronizar partidos
        run: |
          curl -s "https://futbol-analytics-8401.onrender.com/api/alarmas_hoy?forzar=true"
